services:
  - type: web
    name: supportdesk-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server
    startCommand: npm run db:init --prefix server && npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://supportdesk-client.onrender.com

  - type: web
    name: supportdesk-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://${{supportdesk-api.host}}
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: supportdesk-db
    databaseName: ticket_system
    user: ticket_system_user
    plan: free
